<html lang="de">
<head>

<script>(function(){var m='dark';try{m=localStorage.getItem('kompass-theme')||'dark'}catch(e){}var t=m==='auto'?(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m;document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{
  --bg:#05080d; --panel:#0b1118; --card:#0f1620; --card2:#0a0f15; --line:#1b2532; --line2:#2a3647; --line3:#36465b; --text:#dfe6ef; --soft:#b9c4d2; --soft2:#c9d2de; --mute:#7f8b9c;
  --up:#1fcf8f; --down:#f0605d; --gold:#f5c542; --blue:#4c9aff; --purple:#b388ff; --orange:#ff9f43;
  --chart:#020407; --hdr:rgba(5,8,13,.92); --veil:rgba(5,8,13,.75); --on-gold:#1b1505; --on-up:#03140d;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme="light"]{
  --bg:#f3f5f9; --panel:#eef2f7; --card:#ffffff; --card2:#f7f9fc; --line:#dde3ec; --line2:#c9d2de; --line3:#b7c2d1; --text:#131a26; --soft:#3d4757; --soft2:#2c3646; --mute:#5d6879;
  --up:#087f5b; --down:#c62f2c; --gold:#946200; --blue:#1a66c9; --purple:#7445cc; --orange:#b45000;
  --chart:#ffffff; --hdr:rgba(243,245,249,.92); --veil:rgba(255,255,255,.85); --on-gold:#ffffff; --on-up:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;flex:none}
.brand{font-family:var(--mono);font-weight:800;letter-spacing:.06em;font-size:15px;line-height:1.15;cursor:pointer}
.brand small{display:block;color:var(--mute);font-weight:500;font-size:11px;letter-spacing:.12em}
.theme{margin-left:auto;display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.theme button{border:0;background:none;color:var(--mute);font-family:var(--mono);font-size:12px;font-weight:700;border-radius:999px;padding:6px 10px;min-height:32px}
.theme button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.theme button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.prog{margin-left:12px;font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right}
.bar{width:110px;height:5px;background:var(--line);border-radius:9px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));width:0;transition:width .4s}
main{display:grid;grid-template-columns:320px 1fr;max-width:1280px;margin:0 auto;min-height:calc(100vh - 60px)}
#nav{border-right:1px solid var(--line);padding:14px 12px 40px;height:calc(100vh - 60px);overflow:auto;position:sticky;top:60px}
#search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:none}
#search:focus{border-color:var(--gold)}
.cat{margin:18px 4px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--acc,var(--mute));text-transform:uppercase;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;width:calc(100% - 8px);text-align:left}
.cat::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 8px;margin:2px 0}
.item:hover{background:var(--card)}
.item.on{background:var(--card);border-color:var(--line2)}
.item .ic{width:34px;height:34px;flex:none;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:12px;color:var(--acc)}
.item b{display:block;font-size:14.5px;font-weight:600}
.item span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.item .ok{margin-left:auto;color:var(--up);font-size:14px;opacity:0}
.item.seen .ok{opacity:1}
.empty{color:var(--mute);font-size:14px;padding:14px 6px}
#view{padding:18px 22px 60px;min-width:0}
.back{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;margin-bottom:12px;font-family:var(--mono);font-weight:700;letter-spacing:.04em}
.back:hover{border-color:var(--line3)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
h1{font-family:var(--mono);font-weight:800;letter-spacing:.03em;font-size:clamp(24px,4.4vw,36px);margin:4px 0 6px;text-transform:uppercase;line-height:1.15}
.lead{color:var(--soft);margin:0 0 14px;font-size:15.5px;line-height:1.5;max-width:760px}
.player{background:var(--chart);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:780px}
.cwrap{position:relative;cursor:pointer}
canvas{display:block;width:100%;aspect-ratio:540/400}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.overlay div{background:var(--veil);border:1px solid var(--line2);border-radius:999px;padding:12px 18px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em}
.caption{padding:12px 16px 4px;min-height:84px;border-top:1px solid var(--line)}
.caption .no{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.14em}
.caption p{margin:5px 0 0;font-size:15.5px;line-height:1.45}
.ctrl{display:flex;align-items:center;gap:8px;padding:8px 12px 6px}
.cb{background:var(--card);border:1px solid var(--line);border-radius:9px;min-width:40px;height:38px;padding:0 10px;font-family:var(--mono);font-size:14px;font-weight:700;flex:none}
.cb:hover{border-color:var(--line3)}
#seek{flex:1;min-width:60px;accent-color:var(--down);height:28px}
.time{font-family:var(--mono);font-size:11.5px;color:var(--mute);flex:none;min-width:74px;text-align:right}
.row2{display:flex;align-items:center;gap:8px;padding:2px 12px 14px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{background:none;border:1px solid var(--line);border-radius:999px;min-width:32px;height:30px;padding:0 10px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--mute)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip.done{color:var(--text)}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.speed button{border:0;background:none;border-radius:999px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--mute);height:26px;padding:0 9px}
.speed button.on{background:var(--line2);color:var(--text)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:16px;max-width:900px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.box p,.box li{font-size:14.5px;line-height:1.5;color:var(--soft2);margin:0}
.box ul{margin:0;padding-left:18px}.box li{margin:3px 0}
.box.g h3{color:var(--up)}.box.y h3{color:var(--gold)}.box.b h3{color:var(--blue)}.box.r h3{color:var(--down)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px;max-width:900px}
.pn button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-size:14px;min-width:0}
.pn button:last-child{text-align:right}
.pn small{display:block;color:var(--mute);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;margin-bottom:3px}
.pn button:disabled{opacity:.35;cursor:default}
.disc{color:var(--mute);font-size:12px;margin-top:22px;max-width:900px;line-height:1.5}
.home{max-width:960px}
.bigtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:18px}
.big{position:relative;overflow:hidden;text-align:left;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;min-height:172px;display:flex;flex-direction:column;transition:transform .15s,border-color .15s;color:var(--text);text-decoration:none}
.big:hover{transform:translateY(-2px);border-color:var(--acc)}
.big::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
.big::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.big .bi{position:absolute;right:14px;top:16px;color:var(--acc);z-index:1}
.big h2{font-family:var(--mono);font-weight:800;font-size:clamp(17px,1.6vw + 6px,21px);letter-spacing:.03em;text-transform:uppercase;margin:0 70px 8px 0;line-height:1.2;color:var(--acc)}
.big p{margin:0 0 14px;color:var(--soft);font-size:14.5px;line-height:1.45;max-width:85%}
.big .ft{margin-top:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.big .pb{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}.big .pb i{display:block;height:100%;background:var(--acc)}
.big .go{color:var(--acc);font-size:16px;font-weight:800}
.big.small{min-height:0}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:16px;max-width:960px}
.lc{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lc:hover{border-color:var(--acc)}
.lc .ic{width:48px;height:48px;flex:none;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:17px;color:var(--acc)}
.lc small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.lc b{display:block;font-size:16px;margin:2px 0}
.lc span{display:block;font-size:13px;color:var(--mute)}
.lc .ok{margin-left:auto;color:var(--up);font-size:18px;flex:none}
.start{margin-top:6px;background:var(--acc,var(--up));color:var(--bg);border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px}
.ahead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ahead .apb{flex:1;min-width:160px;max-width:300px;height:6px;background:var(--line);border-radius:9px;overflow:hidden}.ahead .apb i{display:block;height:100%;background:var(--acc)}
.ahead span{font-family:var(--mono);font-size:12px;color:var(--mute)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:760px}
.qtop{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--mute);margin-bottom:8px}
.qbar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.qbar i{display:block;height:100%;background:var(--gold)}
.qtag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;border:1px solid var(--line2);border-radius:999px;padding:3px 8px;color:var(--mute);margin-bottom:8px}
.qq{font-size:18px;font-weight:700;line-height:1.4;margin:0 0 12px}
.qcv{max-width:620px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:var(--chart)}
.opts{display:grid;gap:8px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;font-size:15.5px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--line3)}
.opt.ok{border-color:var(--up);background:rgba(31,207,143,.12)}
.opt.bad{border-color:var(--down);background:rgba(240,96,93,.12)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14.5px;line-height:1.5}
.fb b{font-family:var(--mono)}
.qnav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qnav button{flex:1;min-width:140px;border-radius:12px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--panel)}
.qnav .main{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.score{font-family:var(--mono);font-size:54px;font-weight:800;margin:6px 0}
.rep{display:grid;gap:8px;margin-top:10px}
.calc{margin-top:16px;max-width:900px}
.calc h3{color:var(--orange) !important}
.calc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0 12px}
.calc label{font-size:12px;color:var(--mute);font-family:var(--mono);letter-spacing:.06em}
.calc input,.calc select{width:100%;margin-top:4px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px}
.calc .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.calc .res div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.calc .res span{display:block;font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.calc .res b{font-family:var(--mono);font-size:18px}
.calc .note{font-size:12.5px;color:var(--mute);margin-top:8px}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  #nav{display:none}
  #view{padding:14px 12px 50px}
  .bar{width:64px}
  .theme button .tl{display:none}
  .theme button{padding:6px 9px}
  .brand small{display:none}
  header{gap:8px;padding-left:12px;padding-right:12px}
  .prog{margin-left:4px}
}
@media (max-width:380px){ .time{display:none} }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#0f1620"/><rect x="4" y="11" width="11" height="12" rx="2.5" fill="none" stroke="#4c9aff" stroke-width="2.2"/><rect x="19" y="11" width="11" height="12" rx="2.5" fill="#f5c542"/><line x1="15" y1="17" x2="19" y2="17" stroke="#4c9aff" stroke-width="2.2"/></svg>
  <div class="brand" id="brand">KRYPTO-SCHULE<small>BAYAZIT · KRYPTO VERSTEHEN</small></div>
  <div class="theme" role="group" aria-label="Darstellung"><button data-m="dark" title="Dunkel">☾<span class="tl"> Dunkel</span></button><button data-m="light" title="Hell">☀<span class="tl"> Hell</span></button><button data-m="auto" title="Automatisch">◐<span class="tl"> Auto</span></button></div>
  <div class="prog"><span id="progtxt">0 / 0</span><div class="bar"><i id="progbar"></i></div></div>
</header>
<main>
  <nav id="nav">
    <input id="search" placeholder="Lektion suchen … z. B. Hebel" autocomplete="off" aria-label="Lektion suchen">
    <div id="list"></div>
  </nav>
  <section id="view"></section>
</main>
<script>
"use strict";
/* ================= Farben ================= */
const THEMES={
 dark:{bg:'#020407',grid:'#111a24',card:'#0f1620',line:'#2a3647',text:'#e6ecf3',soft:'#b9c4d2',mute:'#7f8b9c',up:'#1fcf8f',down:'#f0605d',gold:'#f5c542',blue:'#4c9aff',purple:'#b388ff',orange:'#ff9f43',pillBg:'rgba(2,4,7,.9)',onTag:'#05080d'},
 light:{bg:'#ffffff',grid:'#e6ebf2',card:'#f3f6fa',line:'#c9d2de',text:'#131a26',soft:'#3d4757',mute:'#5d6879',up:'#087f5b',down:'#c62f2c',gold:'#946200',blue:'#1a66c9',purple:'#7445cc',orange:'#b45000',pillBg:'rgba(255,255,255,.95)',onTag:'#ffffff'}};
const C=Object.assign({},THEMES.dark);
let THEME='dark';
function setCanvasTheme(t){THEME=t;Object.assign(C,THEMES[t]||THEMES.dark);}
const MONO="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace";
const SANS="'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
const W=540,H=400;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const P=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const PL_=(t,a,b)=>clamp((t-a)/(b-a));
const L=(a,b,p)=>a+(b-a)*p;
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const de=(n,d=0)=>Number(n).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const nz=(i,s=1)=>{const v=Math.sin(i*12.9898+s*78.233)*43758.5453;return v-Math.floor(v);};
function hx(n,len=16){let x=(n*2654435761+97)>>>0,s='';for(let i=0;i<len;i++){x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;s+='0123456789abcdef'[x&15];}return s;}

/* ================= Zeichen-Helfer ================= */
let X=null;
function A(a,fn){if(a<=0.001)return;X.save();X.globalAlpha*=Math.min(1,a);fn();X.restore();}
function rrp(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function box(x,y,w,h,o={}){rrp(x,y,w,h,o.r??10);if(o.f){X.fillStyle=o.f;X.fill();}if(o.s){X.lineWidth=o.lw||2;X.strokeStyle=o.s;if(o.dash)X.setLineDash(o.dash);X.stroke();X.setLineDash([]);}}
function font(o){return `${o.b||700} ${o.sz||17}px ${o.mono===false?SANS:MONO}`;}
function T(s,x,y,o={}){X.font=font(o);X.fillStyle=o.c||C.text;X.textAlign=o.al||'center';X.textBaseline=o.bl||'middle';X.fillText(s,x,y);}
function tw(s,o={}){X.font=font(o);return X.measureText(s).width;}

let QZ=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newQuiz(){const imgs=shuffle(QPOOL.filter(q=>q.img)).slice(0,3),gens=shuffle(QGEN).slice(0,3).map(g=>Object.assign(g(),{gen:true})),know=shuffle(QPOOL.filter(q=>!q.img)).slice(0,4);

 <span class="qtag">${kind}</span><p class="qq">${esc(q.q)}</p>${q.img?'<div class="qcv"><canvas id="qcv"></canvas></div>':''}

 if(q.img){QZ.cv=$('#qcv');drawQuizCanvas();}else QZ.cv=null;
 $('.opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||QZ.answered)return;answer(+b.dataset.k);};}
function drawQuizCanvas(){const q=QZ.qs[QZ.i];if(!q||!q.img||!QZ.cv)return;sizeCanvas(QZ.cv);paint(QZ.cv.getContext('2d'),QZ.cv,BYID[q.img[0]],q.img[1]);}
function answer(k){const q=QZ.qs[QZ.i];QZ.answered=true;const ok=q.opts[k].ok;if(ok)QZ.score++;else if(!QZ.wrong.includes(q.l))QZ.wrong.push(q.l);
 [...document.querySelectorAll('.opt')].forEach((b,i)=>{b.disabled=true;if(q.opts[i].ok)b.classList.add('ok');else if(i===k)b.classList.add('bad');});
 const last=QZ.i===QZ.qs.length-1;
 $('#qfb').innerHTML=`<div class="fb"><b style="color:var(--${ok?'up':'down'})">${ok?'✓ RICHTIG':'✗ FALSCH'}</b> – ${esc(q.ex)}</div><div class="qnav"><button onclick="location.hash='l-${q.l}'">Zur Lektion: ${esc(BYID[q.l].title)}</button><button class="main" id="qnext">${last?'Ergebnis anzeigen':'Nächste Frage →'}</button></div>`;

 $('#qfb').scrollIntoView({behavior:'smooth',block:'nearest'});}
function finishQuiz(){QZ.done=true;const best=Math.max(store.get('krypto-best',0)||0,QZ.score);store.set('krypto-best',best);
 const msg=QZ.score>=9?'Hervorragend – du bist ein Krypto-Profi!':QZ.score>=7?'Sehr gut! Nur noch wenige Lücken.':QZ.score>=5?'Solide. Wiederhole die Lektionen unten.':'Kein Problem – schau dir die Lektionen unten noch einmal an.';

/* ================= Theme ================= */
let MODE=store.get('kompass-theme-raw',null)||(()=>{try{return localStorage.getItem('kompass-theme')||'dark'}catch(e){return 'dark'}})();
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
function applyTheme(){const t=MODE==='auto'?(mq&&mq.matches?'light':'dark'):MODE;document.documentElement.setAttribute('data-theme',t);setCanvasTheme(t);
 document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===MODE)));
 const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=t==='light'?'#f3f5f9':'#05080d';
 if(QZ&&QZ.cv&&document.body.contains(QZ.cv))drawQuizCanvas();}
document.querySelectorAll('.theme button').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;try{localStorage.setItem('kompass-theme',MODE);}catch(e){}applyTheme();});
if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(MODE==='auto')applyTheme();});

/* ================= Router ================= */
function route(){const h=location.hash.slice(1);stopPlayer();
 if(h==='quiz')renderQuiz();else if(h.startsWith('b-'))renderArea(h.slice(2));else if(h.startsWith('l-'))renderLesson(h.slice(2));else renderHome();
 renderNav();window.scrollTo(0,0);}
$('#brand').onclick=()=>{location.hash='';};
window.addEventListener('hashchange',route);
applyTheme();updProgress();route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(QZ&&QZ.cv)drawQuizCanvas();});
